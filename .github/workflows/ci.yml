name: CI

on:
  push:
    branches: [main, "*-dev"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PHI / credential guard
        run: python3 tools/dev/check_no_phi.py
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.18.4 -c
          "git config --global --add safe.directory /repo &&
          gitleaks detect --source /repo --config /repo/.gitleaks.toml --redact -v"
      - name: ruff
        run: pipx run ruff check --select E9,F63,F7,F82 bin tests tools
      - uses: nf-core/setup-nextflow@v2
        with:
          version: latest-everything
      - name: nextflow lint
        run: nextflow lint .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest openpyxl
      - run: pytest -q

  stub:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow: ["25.04.6", "25.10.2", "latest-everything"]
    steps:
      - uses: actions/checkout@v5
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}
      - run: nextflow run . -profile test_stub -stub-run

  test_fasta:
    runs-on: ubuntu-latest
    needs: [pytest, stub]
    steps:
      - uses: actions/checkout@v5
      - uses: nf-core/setup-nextflow@v2
        with:
          version: latest-everything
      - name: FASTA input end to end (Docker)
        run: nextflow run . -profile test_fasta,docker
      - name: Check outputs
        run: |
          test "$(ls results_test_fasta/fhir/genomic/*.genomic.fhir.json | wc -l)" -eq 4
          test "$(ls results_test_fasta/fhir/bundle/*.bundle.fhir.json | wc -l)" -eq 4
          grep -q '"code": "DENV-1"' results_test_fasta/fhir/genomic/DENV1_REF.genomic.fhir.json
          grep -q '"code": "DENV-4"' results_test_fasta/fhir/genomic/DENV4_REF.genomic.fhir.json
